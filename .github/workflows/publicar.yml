# Junta as partes enviadas pelo tools/publicar.js, confere, cria a release e publica o aviso de atualização.
# Com o campo bonus: junta os vídeos trancados do bônus que vieram por um ramo provisório e publica na release "bonus"
# (pré-lançamento, nunca vira a última versão dos instaladores); depois apaga o ramo.
name: publicar
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão (ex.: 2.5.0)"
        required: false
      bonus:
        description: "Bônus: ramo provisório (bonus-envio-...) com os vídeos trancados"
        required: false
permissions:
  contents: write
jobs:
  publicar:
    if: inputs.bonus == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: envio-${{ inputs.versao }}
          path: envio
      - name: Juntar as partes e conferir
        run: |
          mkdir saida
          while read -r f; do [ -n "$f" ] && cat envio/partes/"$f".* > saida/"$f"; done < envio/arquivos.txt
          cd saida && sha256sum -c ../envio/sha256.txt
      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # o GitHub às vezes recusa na primeira vez: tenta até 3 vezes, apagando a release pela metade
          for i in 1 2 3; do
            gh release create "v${{ inputs.versao }}" saida/* --repo "$GITHUB_REPOSITORY" --title "Motion Church ${{ inputs.versao }}" --notes-file envio/notas.md --latest && exit 0
            gh release delete "v${{ inputs.versao }}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            sleep 20
          done
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Publicar o aviso de atualização
        run: |
          cp envio/atualizacao.json main/atualizacao.json
          cp envio/README.md main/README.md
          cd main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Versão ${{ inputs.versao }}"
          git push
      - name: Apagar o ramo provisório
        run: git -C envio push origin --delete "envio-${{ inputs.versao }}"
  bonus:
    if: inputs.bonus != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bonus }}
      - name: Juntar e conferir
        run: |
          mkdir -p /tmp/sai
          for s in .bonus/*.sha; do
            id=$(basename "$s" .sha)
            cat $(ls .bonus/$id.mcb.* | sort) > /tmp/sai/$id.mcb
            echo "$(cat $s)  /tmp/sai/$id.mcb" | sha256sum -c -
          done
          ls -la /tmp/sai
      - name: Enviar para a release bonus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bonus >/dev/null 2>&1 || gh release create bonus --prerelease --latest=false --title "Bônus do Motion Church (arquivos protegidos)" --notes "Arquivos trancados do bônus. Abra pelo programa Motion Church: botão Bônus, na lista de arquivos."
          for i in 1 2 3; do gh release upload bonus /tmp/sai/*.mcb --clobber && break; sleep 20; done
      - name: Apagar o ramo provisório
        run: git push origin --delete "${{ inputs.bonus }}"

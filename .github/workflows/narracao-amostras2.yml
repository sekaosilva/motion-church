# Amostras mais naturais: Kokoro homem com ritmo e pausas ajustados, e Chatterbox (multilíngue, licença MIT) com o timbre do Kokoro homem.
name: narracao-amostras2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  amostras:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q "kokoro>=0.9" soundfile
      - name: Kokoro homem com pausas
        run: |
          mkdir -p saida
          python - <<'PY'
          from kokoro import KPipeline
          import soundfile as sf, numpy as np, re
          t = open('narracao/amostra.txt', encoding='utf-8').read().strip()
          p = KPipeline(lang_code='p')
          frases = [f.strip() for f in re.split(r'(?<=[.!?])\s+', t) if f.strip()]
          sr = 24000; out = [np.zeros(int(sr * .25))]
          for vel, nome in [(0.92, 'kokoro-homem-pausas'), (0.86, 'kokoro-homem-calmo')]:
              out = [np.zeros(int(sr * .25))]
              for f in frases:
                  out += [a for _, _, a in p(f, voice='pm_alex', speed=vel)]
                  out.append(np.zeros(int(sr * (.42 if f.endswith('.') else .25))))
              sf.write(f'saida/{nome}.wav', np.concatenate(out), sr)
          # referência de timbre para o Chatterbox: uma frase do Kokoro homem
          ref = [a for _, _, a in p('Olá! Bem-vindo ao Motion Church. Nesta aula você vai aprender a montar o culto passo a passo.', voice='pm_alex', speed=0.95)]
          sf.write('ref-homem.wav', np.concatenate(ref), sr)
          PY
      - name: Chatterbox multilíngue
        continue-on-error: true
        run: |
          pip install -q chatterbox-tts
          python - <<'PY'
          import torch, torchaudio, re
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          m = ChatterboxMultilingualTTS.from_pretrained(device='cpu')
          t = open('narracao/amostra.txt', encoding='utf-8').read().strip()
          frases = [f.strip() for f in re.split(r'(?<=[.!?])\s+', t) if f.strip()]
          for ref, nome in [('ref-homem.wav', 'chatterbox-homem'), (None, 'chatterbox-padrao')]:
              partes = []
              for f in frases:
                  w = m.generate(f, language_id='pt', audio_prompt_path=ref, exaggeration=0.5, cfg_weight=0.5) if ref else m.generate(f, language_id='pt')
                  partes += [w, torch.zeros(1, int(m.sr * .35))]
              torchaudio.save(f'saida/{nome}.wav', torch.cat(partes, dim=1), m.sr)
          PY
      - name: Converter e guardar
        run: |
          cd saida && for f in *.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 128k "${f%.wav}.mp3"; done; rm -f *.wav; ls -la
          cd .. && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git checkout -B narracao-amostras2 && mkdir -p narracao/amostras2 && mv saida/*.mp3 narracao/amostras2/
          git add narracao/amostras2 && git commit -m "Amostras de narração 2" && git push -f origin narracao-amostras2

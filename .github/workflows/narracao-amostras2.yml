# (2.17.0) Este arquivo foi reaproveitado: monta o leitor de NDI (grandiose, Apache-2.0, sobre o NDI SDK 6)
# para Mac (Apple e Intel), Windows e Linux, e publica na release "ndi". O build do programa baixa daqui.
name: ndi-binarios
on: workflow_dispatch
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Compilar (Apple e Intel)
        run: |
          mkdir w && cd w && npm init -y >/dev/null
          npm i --no-audit --no-fund @stagetimerio/grandiose@0.2.1
          G=node_modules/@stagetimerio/grandiose
          mkdir -p ../saida
          cp $G/build/Release/grandiose.node ../saida/ndi-darwin-arm64.node
          cp $G/build/Release/libndi.dylib ../saida/libndi.dylib
          cp $G/dist/index.js ../saida/ndi-index.js
          (cd $G && npx -y node-gyp@11 rebuild --arch=x64)
          cp $G/build/Release/grandiose.node ../saida/ndi-darwin-x64.node
          lipo -info ../saida/libndi.dylib || true
          file ../saida/*.node
          otool -L ../saida/ndi-darwin-arm64.node || true
          otool -l ../saida/ndi-darwin-arm64.node | grep -A2 LC_RPATH || true
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: saida }
  win:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Compilar (Windows x64)
        shell: bash
        run: |
          set -o pipefail
          ( mkdir w && cd w && npm init -y >/dev/null
            npm i --no-audit --no-fund --foreground-scripts @stagetimerio/grandiose@0.2.1
            G=node_modules/@stagetimerio/grandiose
            ls -la $G $G/build/Release || true
            mkdir -p ../saida
            cp $G/build/Release/grandiose.node ../saida/ndi-win32-x64.node
            cp $G/build/Release/Processing.NDI.Lib.x64.dll ../saida/
            ls -la ../saida ) 2>&1 | tee log-win.txt
      - name: Guardar o registro (se falhar)
        if: failure()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view ndi-log -R ${{ github.repository }} >/dev/null 2>&1 || gh release create ndi-log -R ${{ github.repository }} --prerelease --latest=false -t "registro" -n "registro do build do NDI"
          gh release upload ndi-log log-win.txt -R ${{ github.repository }} --clobber
      - uses: actions/upload-artifact@v4
        with: { name: win, path: saida }
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Compilar (Linux x64, para os testes)
        run: |
          mkdir w && cd w && npm init -y >/dev/null
          npm i --no-audit --no-fund @stagetimerio/grandiose@0.2.1
          G=node_modules/@stagetimerio/grandiose
          mkdir -p ../saida
          cp $G/build/Release/grandiose.node ../saida/ndi-linux-x64.node
          cp -L $G/build/Release/libndi.so.6 ../saida/libndi.so.6
          cp $G/dist/index.js ../saida/ndi-index-linux.js
          ls -la ../saida; ls -la $G/ndi || true; find $G/ndi -iname "*licen*" -o -iname "*.txt" | head
          find $G/ndi -iname "*licen*" -exec cp {} ../saida/ \; || true
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: saida }
  publicar:
    needs: [mac, win, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: tudo }
      - name: Release ndi
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir s && find tudo -type f -exec cp {} s/ \;
          (cd s && sha256sum * > SHA256SUMS.txt && ls -la)
          gh release view ndi -R ${{ github.repository }} >/dev/null 2>&1 || gh release create ndi -R ${{ github.repository }} --prerelease --latest=false -t "Leitor de NDI (componentes)" -n "Componentes do leitor de NDI usados pelo Motion Church. NDI® é uma marca registrada da Vizrt NDI AB."
          gh release upload ndi s/* -R ${{ github.repository }} --clobber

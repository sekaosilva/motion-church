# (2.14.0) Copia o modelo de voz Chatterbox multilíngue (licença MIT, ResembleAI/chatterbox) para a release
# "modelo-voz" deste repositório, para gerar narração fora do GitHub Actions quando os minutos acabam.
# A voz do dono (a referência) não passa por aqui: ela fica só no repositório privado da narração.
name: narracao-amostras
on: workflow_dispatch
permissions:
  contents: write
jobs:
  modelo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Baixar o modelo
        run: |
          pip install -q huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='ResembleAI/chatterbox', local_dir='modelo', allow_patterns=['ve.pt','t3_mtl23ls_v2.safetensors','s3gen.pt','grapheme_mtl_merged_expanded_v1.json','conds.pt','LICENSE'])"
          cd modelo && rm -rf .cache && ls -la
          for f in *; do s=$(stat -c%s "$f"); if [ $s -gt 1900000000 ]; then split -b 1800m -d -a 2 "$f" "$f.p" && rm "$f"; fi; done; ls -la
      - name: Publicar na release modelo-voz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view modelo-voz >/dev/null 2>&1 || gh release create modelo-voz --prerelease --latest=false --title "Modelo de voz (Chatterbox, MIT)" --notes "Cópia do modelo ResembleAI/chatterbox (licença MIT) para gerar a narração das videoaulas."
          for i in 1 2 3; do gh release upload modelo-voz modelo/* --clobber && break; sleep 20; done

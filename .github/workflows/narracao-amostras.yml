# Gera amostras de narração com vozes gratuitas (Kokoro e Piper) para o dono escolher a voz das aulas.
name: narracao-amostras
on: workflow_dispatch
permissions:
  contents: write
jobs:
  amostras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q "kokoro>=0.9" soundfile piper-tts
      - name: Kokoro (mulher e homem)
        run: |
          mkdir -p saida
          python - <<'PY'
          from kokoro import KPipeline
          import soundfile as sf, numpy as np
          t = open('narracao/amostra.txt', encoding='utf-8').read().strip()
          p = KPipeline(lang_code='p')
          for voz, nome in [('pf_dora', 'kokoro-mulher'), ('pm_alex', 'kokoro-homem')]:
              partes = [a for _, _, a in p(t, voice=voz, speed=1.0)]
              sf.write(f'saida/{nome}.wav', np.concatenate(partes), 24000)
          PY
      - name: Piper (homem)
        run: |
          curl -sSL -o faber.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx
          curl -sSL -o faber.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json
          piper -m faber.onnx -f saida/piper-homem.wav < narracao/amostra.txt
      - name: Converter e guardar
        run: |
          cd saida && for f in *.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 128k "${f%.wav}.mp3"; done; rm -f *.wav; ls -la
          cd .. && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git checkout -B narracao-amostras && mkdir -p narracao/amostras && mv saida/*.mp3 narracao/amostras/
          git add narracao/amostras && git commit -m "Amostras de narração" && git push -f origin narracao-amostras

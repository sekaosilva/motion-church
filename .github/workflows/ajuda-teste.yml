# Faz as perguntas de pagamento/teste/perguntas.json à ajuda com IA publicada e guarda as respostas (para conferir a qualidade).
name: ajuda-teste
on: workflow_dispatch
permissions:
  contents: write
jobs:
  perguntar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Perguntar
        run: |
          U=$(jq -r .servico pagamento/estado.json)
          echo '[]' > /tmp/r.json
          n=$(jq length pagamento/teste/perguntas.json)
          for i in $(seq 0 $((n-1))); do
            B=$(jq -c ".[$i]" pagamento/teste/perguntas.json)
            T0=$(date +%s.%N); R=$(curl -sS -m 60 -X POST "$U/ajuda" -H 'content-type: application/json' -d "$B" || echo '{"erro":"curl"}'); T1=$(date +%s.%N)
            jq --argjson b "$B" --argjson r "$R" --arg s "$(echo "$T1 - $T0" | bc)" '. + [{p: $b.p, r: ($r.r // $r.erro), s: $s}]' /tmp/r.json > /tmp/r2.json && mv /tmp/r2.json /tmp/r.json
            sleep 2
          done
          cp /tmp/r.json pagamento/teste/respostas.json
          # bônus: o serviço libera a chave para um código válido (de teste, vence em 1 dia) e o vídeo destrancado confere
          if [ -f pagamento/teste/bonus-teste.json ]; then
            python3 - <<'PY' > pagamento/teste/bonus-resultado.json 2>&1 || true
          import json, urllib.request, hashlib, subprocess
          t = json.load(open('pagamento/teste/bonus-teste.json')); cat = json.load(open('docs/bonus/catalogo.json')); est = json.load(open('pagamento/estado.json'))
          it = [x for x in cat['itens'] if x['id'] == t['id']][0]
          def chave(cod, maq):
              out = subprocess.run(['curl', '-sS', '-m', '60', '-X', 'POST', est['servico'] + '/bonus/chave', '-H', 'content-type: application/json', '-d', json.dumps({'codigo': cod, 'maq': maq, 'cifrada': it['cifrada']})], capture_output=True, text=True).stdout
              try: return json.loads(out)
              except Exception: return {'erro': 'resposta: ' + out[:200]}
          r = chave(t['codigo'], t['maq']); r2 = chave(t['codigo'], 'ZZ99-ZZ99'); r3 = chave('MC-AAAAA', t['maq'])
          ok = False
          if r.get('chave'):
              subprocess.check_call(['curl', '-sSL', '-o', '/tmp/b.mcb', cat['base'] + '/' + it['id'] + '.mcb'])
              subprocess.check_call(['openssl', 'enc', '-d', '-aes-256-ctr', '-K', r['chave'], '-iv', r['iv'], '-in', '/tmp/b.mcb', '-out', '/tmp/b.mp4'])
              ok = hashlib.sha256(open('/tmp/b.mp4', 'rb').read()).hexdigest() == it['sha']
          print(json.dumps({'liberou_e_conferiu': ok, 'liberou': bool(r.get('chave')), 'erro': r.get('erro'), 'outro_computador': r2.get('erro'), 'codigo_falso': r3.get('erro')}, ensure_ascii=False))
          PY
            git add pagamento/teste/bonus-resultado.json
          fi
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add pagamento/teste/respostas.json && git commit -m "Ajuda com IA: respostas de teste" || true
          git pull --rebase && git push
